<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四季邮局 · 查阅站</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #fefcf5; padding: 2rem; }
        .container { max-width: 1200px; margin: auto; }
        .admin-panel, .search-bar { background: white; padding: 1rem; border-radius: 1rem; margin-bottom: 1rem; }
        .application-item, .letter-card { background: #f9f9f9; margin-bottom: 0.5rem; padding: 1rem; border-radius: 0.5rem; }
        button { margin: 0.2rem; padding: 0.3rem 0.8rem; cursor: pointer; }
        .btn-approve { background: #5cb85c; color: white; border: none; }
        .btn-reject { background: #d9534f; color: white; border: none; }
        .search-input { width: 100%; padding: 0.5rem; }
        .status-badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 1rem; font-size: 0.8rem; margin-left: 0.5rem; }
        .status-pending { background: #f0ad4e; color: white; }
        .status-approved { background: #5cb85c; color: white; }
        .status-rejected { background: #d9534f; color: white; }
        .status-expired { background: #777; color: white; }
    </style>
</head>
<body>
<div class="container">
    <h2>📖 四季邮局 · 查阅站</h2>
    <div id="adminPanel" class="admin-panel">加载中...</div>
    <div class="search-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索信件主题或内容...">
    </div>
    <div id="lettersContainer"></div>
</div>
<script>
    // Supabase 配置（与投递站一致）
    const SUPABASE_URL = 'https://sgvgfquwqofnmhfvmgzo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNndmdmcXV3cW9mbm1oZnZtZ3pvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNTI3MzMsImV4cCI6MjA5NDgyODczM30.PnmLtxKnCvm90MP3Jp4FCUCWMGzP9Ivqm6WKZBbJ6M8';
    
    // 改名避免与投递站变量名冲突（可选，但更安全）
    const supabaseAdmin = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let applications = [];
    let letters = [];
    let searchKeyword = '';

    // 通用错误提示
    function showError(msg) {
        console.error(msg);
        // 也可在页面顶部短暂显示，这里仅控制台输出
    }

    // 加载数据：应用表按 id 倒序（id 是时间戳），信件表按 timestamp 倒序
    async function loadData() {
        try {
            // 注意：应用表没有 created_at 字段，改用 id 排序（id 即 Date.now()）
            const { data: apps, error: appsErr } = await supabaseAdmin
                .from('应用')
                .select('*')
                .order('id', { ascending: false });
            if (appsErr) throw appsErr;
            
            // 信件表有 timestamp 字段（字符串格式），但为了排序一致，也按 id 倒序（id 也是时间戳）
            const { data: lets, error: letsErr } = await supabaseAdmin
                .from('信件')
                .select('*')
                .order('id', { ascending: false });
            if (letsErr) throw letsErr;
            
            applications = apps || [];
            letters = lets || [];
            renderAdmin();
            renderLetters();
        } catch (err) {
            showError("加载数据失败: " + err.message);
            document.getElementById('adminPanel').innerHTML = '<div>❌ 加载失败，请检查控制台或网络</div>';
            document.getElementById('lettersContainer').innerHTML = '<div>❌ 加载失败</div>';
        }
    }

    // 审核通过
    async function approve(id) {
        try {
            const { error } = await supabaseAdmin
                .from('应用')
                .update({ status: 'approved' })
                .eq('id', id);
            if (error) throw error;
            await loadData();
        } catch (err) {
            alert("操作失败: " + err.message);
        }
    }

    // 拒绝申请
    async function reject(id) {
        try {
            const { error } = await supabaseAdmin
                .from('应用')
                .update({ status: 'rejected' })
                .eq('id', id);
            if (error) throw error;
            await loadData();
        } catch (err) {
            alert("操作失败: " + err.message);
        }
    }

    // 删除申请
    async function deleteApp(id) {
        if (!confirm('确定删除该申请记录吗？')) return;
        try {
            const { error } = await supabaseAdmin
                .from('应用')
                .delete()
                .eq('id', id);
            if (error) throw error;
            await loadData();
        } catch (err) {
            alert("删除失败: " + err.message);
        }
    }

    // 删除信件
    async function deleteLetter(id) {
        if (!confirm('确定删除这封信件吗？')) return;
        try {
            const { error } = await supabaseAdmin
                .from('信件')
                .delete()
                .eq('id', id);
            if (error) throw error;
            await loadData();
        } catch (err) {
            alert("删除失败: " + err.message);
        }
    }

    // 标记信件为已读
    async function markRead(id) {
        try {
            const { error } = await supabaseAdmin
                .from('信件')
                .update({ read: true })
                .eq('id', id);
            if (error) throw error;
            await loadData();
        } catch (err) {
            alert("标记失败: " + err.message);
        }
    }

    // 渲染申请列表（带状态标签）
    function renderAdmin() {
        const panel = document.getElementById('adminPanel');
        if (!applications.length) {
            panel.innerHTML = '<div>📭 暂无投递申请</div>';
            return;
        }
        
        let html = '<h3>📋 投递申请列表</h3>';
        applications.forEach(app => {
            let statusText = '';
            let statusClass = '';
            switch (app.status) {
                case 'pending': statusText = '待审核'; statusClass = 'status-pending'; break;
                case 'approved': statusText = '已批准'; statusClass = 'status-approved'; break;
                case 'rejected': statusText = '已拒绝'; statusClass = 'status-rejected'; break;
                case 'expired': statusText = '已用完'; statusClass = 'status-expired'; break;
                default: statusText = app.status; statusClass = '';
            }
            html += `
                <div class="application-item">
                    <strong>${escapeHtml(app.name)}</strong> (${app.birthday || '未填'}) 
                    <span class="status-badge ${statusClass}">${statusText}</span>
                    <br>已投递次数: ${app.usedCount || 0} / 3
                    <div style="margin-top: 0.5rem;">
                        ${app.status === 'pending' ? `
                            <button class="btn-approve" data-id="${app.id}">✅ 同意</button>
                            <button class="btn-reject" data-id="${app.id}">❌ 拒绝</button>
                        ` : ''}
                        <button class="btn-delete-app" data-id="${app.id}">🗑️ 删除申请</button>
                    </div>
                </div>
            `;
        });
        panel.innerHTML = html;
        
        // 绑定事件（使用事件委托更稳定，但这里简单重新绑定）
        document.querySelectorAll('.btn-approve').forEach(btn => {
            btn.addEventListener('click', () => approve(parseInt(btn.dataset.id)));
        });
        document.querySelectorAll('.btn-reject').forEach(btn => {
            btn.addEventListener('click', () => reject(parseInt(btn.dataset.id)));
        });
        document.querySelectorAll('.btn-delete-app').forEach(btn => {
            btn.addEventListener('click', () => deleteApp(parseInt(btn.dataset.id)));
        });
    }

    // 简单防XSS
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // 渲染信件列表（支持搜索）
    function renderLetters() {
        let filtered = letters;
        if (searchKeyword.trim() !== '') {
            const kw = searchKeyword.trim().toLowerCase();
            filtered = letters.filter(l => 
                (l.subject && l.subject.toLowerCase().includes(kw)) || 
                (l.content && l.content.toLowerCase().includes(kw))
            );
        }
        
        const container = document.getElementById('lettersContainer');
        if (!filtered.length) {
            container.innerHTML = '<div>📭 暂无信件</div>';
            return;
        }
        
        let html = '';
        filtered.forEach(l => {
            const isRead = l.read === true;
            const readIcon = isRead ? '✅ 已阅' : '🆕 未阅';
            const seasonIcon = { spring:'🌸', summer:'☀️', autumn:'🍂', winter:'❄️' }[l.season] || '📨';
            // 内容截取前120字，并转义
            const contentPreview = l.content ? escapeHtml(l.content.substring(0, 120)) : '';
            const more = (l.content && l.content.length > 120) ? '…' : '';
            
            html += `
                <div class="letter-card">
                    <div style="display: flex; justify-content: space-between;">
                        <b>📮 ${escapeHtml(l.subject)}</b>
                        <span>${readIcon} ${seasonIcon} ${l.season || ''}</span>
                    </div>
                    <div>✍️ ${escapeHtml(l.sender)} → ${escapeHtml(l.receiver)} | ${l.timestamp || ''}</div>
                    <div>📝 ${contentPreview}${more}</div>
                    <div style="margin-top: 0.5rem;">
                        ${!isRead ? `<button class="mark-read" data-id="${l.id}">📖 标记已阅</button>` : ''}
                        <button class="delete-letter" data-id="${l.id}">🗑️ 删除信件</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        
        // 绑定事件
        document.querySelectorAll('.mark-read').forEach(btn => {
            btn.addEventListener('click', () => markRead(parseInt(btn.dataset.id)));
        });
        document.querySelectorAll('.delete-letter').forEach(btn => {
            btn.addEventListener('click', () => deleteLetter(parseInt(btn.dataset.id)));
        });
    }

    // 搜索输入监听
    document.getElementById('searchInput').addEventListener('input', (e) => {
        searchKeyword = e.target.value;
        renderLetters();
    });

    // 启动：加载数据 + 实时监听数据库变化
    loadData();
    
    // 订阅所有表的变化（实时刷新）
    const channel = supabaseAdmin.channel('public-changes');
    channel.on('postgres_changes', { event: '*', schema: 'public', table: '应用' }, () => loadData())
           .on('postgres_changes', { event: '*', schema: 'public', table: '信件' }, () => loadData())
           .subscribe((status) => {
               if (status === 'CHANNEL_ERROR') console.warn('实时连接失败，页面将不会自动刷新');
           });
</script>
</body>
</html>
